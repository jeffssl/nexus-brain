# PostgreSQL 18 (uuidv7() nativo) para desarrollo local de Nexus.
# Uso: docker compose -f infra/database/docker-compose.yml --env-file infra/database/.env up -d
services:
  postgres:
    image: postgres:18
    container_name: nexus-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexus}
      POSTGRES_USER: ${POSTGRES_USER:-nexus_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
    ports:
      - "5432:5432"
    volumes:
      - nexus_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus_owner} -d ${POSTGRES_DB:-nexus}"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  nexus_pgdata:
